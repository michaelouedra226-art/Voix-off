name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Compiler l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accepter les licences Android SDK
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Préparer le keystore debug
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Vérifier la configuration Firebase (google-services.json)
        id: firebase_cfg
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "created_from_secret=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n[:space:]' | base64 --decode > app/google-services.json
            echo "created_from_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "created_from_secret=false" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -f "app/google-services.json" ]; then
            echo "::error::Fichier app/google-services.json manquant ! Ajoutez le secret GOOGLE_SERVICES_JSON (contenu JSON brut de app/google-services.json) ou GOOGLE_SERVICES_JSON_BASE64 dans Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if ! python3 -m json.tool app/google-services.json > /dev/null 2>&1; then
            echo "::error::app/google-services.json n'est pas un JSON valide."
            exit 1
          fi
          if ! grep -q "com.aistudio.voxastudio.qrzmkn" app/google-services.json; then
            echo "::error::app/google-services.json ne contient pas le package com.aistudio.voxastudio.qrzmkn."
            exit 1
          fi

      - name: Vérifier la signature Release (optionnelle)
        id: release_signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurer Gradle et le cache
        uses: gradle/actions/setup-gradle@v4

      - name: Vérifier le script gradlew
        run: chmod +x ./gradlew

      - name: Exécuter les tests unitaires et Robolectric
        run: sh ./gradlew :app:testDebugUnitTest --no-daemon --no-parallel --no-configuration-cache -Dkotlin.compiler.execution.strategy=daemon --stacktrace

      - name: Compiler et vérifier l'APK Debug
        run: |
          sh ./gradlew :app:assembleDebug --no-daemon --no-parallel --no-configuration-cache -Dkotlin.compiler.execution.strategy=daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls -1 "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: Publier l'artefact APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: voxa-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Compiler l'APK Release signé
        if: steps.release_signing.outputs.has_release == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          sh ./gradlew :app:assembleRelease --no-daemon --no-parallel --no-configuration-cache -Dkotlin.compiler.execution.strategy=daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Publier l'artefact APK Release
        if: steps.release_signing.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voxa-studio-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Nettoyer les fichiers sensibles temporaires
        if: always()
        run: |
          rm -f debug.keystore "${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ "${{ steps.firebase_cfg.outputs.created_from_secret }}" = "true" ]; then
            rm -f app/google-services.json
          fi
